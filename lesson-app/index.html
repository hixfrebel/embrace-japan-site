<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embrace Japan Mini Quiz</title>
  <meta name="description" content="Mini quiz bahasa Jepang untuk pemula dari Embrace Japan." />
  <style>
    :root {
      --red: #c8102e;
      --black: #101014;
      --white: #fffaf7;
      --muted: #6b6670;
      --card: #ffffff;
      --line: #eee5e2;
      --good: #137a3f;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, var(--white), #fff 45%, #f8eeee);
      color: var(--black);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(16,16,20,.12);
      overflow: hidden;
    }
    header {
      padding: 28px 28px 20px;
      background: var(--black);
      color: white;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--red); display: grid; place-items: center;
      font-weight: 800;
    }
    h1 { margin: 18px 0 8px; font-size: clamp(28px, 6vw, 48px); line-height: 1; }
    header p { margin: 0; color: #f1d7d7; line-height: 1.6; }
    main { padding: 28px; }
    .meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
    .progress { height: 10px; background: #f1e7e5; border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
    .bar { height: 100%; width: 0%; background: var(--red); transition: width .25s ease; }
    .question { font-size: clamp(24px, 5vw, 34px); font-weight: 800; margin: 8px 0 10px; }
    .hint { color: var(--muted); margin-bottom: 22px; line-height: 1.6; }
    .choices { display: grid; gap: 12px; }
    button {
      border: 0;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 17px;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }
    .choice { background: #fff5f4; border: 1px solid #f0d6d2; text-align: left; }
    .choice:hover { transform: translateY(-1px); background: #ffecea; }
    .choice.correct { background: #e9f7ef; border-color: #a9d8bd; color: var(--good); }
    .choice.wrong { background: #fff0ed; border-color: #f0b8ad; color: var(--bad); }
    .feedback { min-height: 58px; margin-top: 18px; font-weight: 700; line-height: 1.5; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .primary { background: var(--red); color: white; }
    .secondary { background: var(--black); color: white; }
    .ghost { background: transparent; border: 1px solid var(--line); color: var(--black); }
    .result { display: none; text-align: center; padding: 10px 0 4px; }
    .score { font-size: 56px; font-weight: 900; color: var(--red); margin: 8px 0; }
    .cta { color: inherit; text-decoration: none; }
    footer { padding: 18px 28px 26px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="brand" href="../" style="color:inherit;text-decoration:none"><div class="mark">日</div><strong>Embrace Japan</strong></a>
      <h1>Mini Quiz Bahasa Jepang</h1>
      <p>Untuk pemula. Belajar hiragana, katakana, dan percakapan sehari-hari.</p>
    </header>

    <main>
      <div class="meta"><span id="count">Question 1/5</span><span id="scoreText">Score 0</span></div>
      <div class="progress"><div class="bar" id="bar"></div></div>

      <section id="quiz">
        <div class="question" id="question"></div>
        <div class="hint" id="hint"></div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="primary" id="nextBtn" style="display:none">Next</button>
        </div>
      </section>

      <section class="result" id="result">
        <h2>Quiz selesai!</h2>
        <div class="score" id="finalScore"></div>
        <p id="finalMessage"></p>
        <div class="actions" style="justify-content:center">
          <button class="ghost" id="restartBtn">Try again</button>
          <a class="cta" id="bookLink" href="#" target="_blank" rel="noreferrer"><button class="secondary">Book free trial lesson</button></a>
        </div>
      </section>
    </main>
    <footer><a href="../" style="color:inherit">← Back to Embrace Japan</a><br>Japanese / English / Indonesian — with Miyake-sensei</footer>
  </div>

  <script>
    const bookingUrl = "https://calendar.app.google/xk9TVfJy4Mg6ZjyZ7";
    const questions = [
      { q: "ありがとう means...?", hint: "Pilih arti yang benar.", choices: ["Terima kasih", "Selamat pagi", "Maaf"], answer: 0, explain: "Benar! ありがとう = terima kasih." },
      { q: "Which one is hiragana?", hint: "Hiragana is the soft Japanese script.", choices: ["ア", "あ", "A"], answer: 1, explain: "Benar! あ is hiragana. ア is katakana." },
      { q: "おはよう means...?", hint: "Used in the morning.", choices: ["Good night", "Good morning", "Goodbye"], answer: 1, explain: "Benar! おはよう = good morning." },
      { q: "カ is...?", hint: "Pilih jenis hurufnya.", choices: ["Hiragana", "Katakana", "Kanji"], answer: 1, explain: "Benar! カ is katakana." },
      { q: "すみません is used for...?", hint: "Very common daily phrase.", choices: ["Excuse me / sorry", "Delicious", "See you"], answer: 0, explain: "Benar! すみません = excuse me / sorry." },
      { q: "こんばんは means...?", hint: "Used in the evening.", choices: ["Good evening", "Good morning", "Thank you"], answer: 0, explain: "Benar! こんばんは = good evening." },
      { q: "Which one is katakana?", hint: "Katakana is often used for foreign words.", choices: ["か", "カ", "火"], answer: 1, explain: "Benar! カ is katakana. か is hiragana." },
      { q: "はい means...?", hint: "A very basic answer word.", choices: ["No", "Yes", "Maybe"], answer: 1, explain: "Benar! はい = yes." },
      { q: "いいえ means...?", hint: "The opposite of はい.", choices: ["No", "Hello", "Please"], answer: 0, explain: "Benar! いいえ = no." },
      { q: "またね means...?", hint: "Casual phrase with friends.", choices: ["See you", "I'm sorry", "Delicious"], answer: 0, explain: "Benar! またね = see you." }
    ];

    let index = 0;
    let score = 0;
    let locked = false;

    const $ = (id) => document.getElementById(id);
    $("bookLink").href = bookingUrl;

    function render() {
      locked = false;
      const item = questions[index];
      $("count").textContent = `Question ${index + 1}/${questions.length}`;
      $("scoreText").textContent = `Score ${score}`;
      $("bar").style.width = `${(index / questions.length) * 100}%`;
      $("question").textContent = item.q;
      $("hint").textContent = item.hint;
      $("feedback").textContent = "";
      $("nextBtn").style.display = "none";
      $("choices").innerHTML = "";
      item.choices.forEach((text, i) => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.textContent = text;
        btn.onclick = () => choose(i, btn);
        $("choices").appendChild(btn);
      });
    }

    function choose(i) {
      if (locked) return;
      locked = true;
      const item = questions[index];
      const buttons = [...document.querySelectorAll(".choice")];
      buttons[item.answer].classList.add("correct");
      if (i === item.answer) {
        score++;
        $("feedback").textContent = item.explain;
      } else {
        buttons[i].classList.add("wrong");
        $("feedback").textContent = `Almost! Correct answer: ${item.choices[item.answer]}`;
      }
      $("scoreText").textContent = `Score ${score}`;
      $("nextBtn").style.display = "inline-block";
    }

    function finish() {
      $("bar").style.width = "100%";
      $("quiz").style.display = "none";
      $("result").style.display = "block";
      $("finalScore").textContent = `${score}/${questions.length}`;
      $("finalMessage").textContent = score >= 4 ? "Great! Kamu siap belajar lebih lanjut." : "Good start! Ayo coba lagi dan belajar pelan-pelan.";
    }

    $("nextBtn").onclick = () => {
      index++;
      if (index >= questions.length) finish();
      else render();
    };
    $("restartBtn").onclick = () => {
      index = 0; score = 0;
      $("quiz").style.display = "block";
      $("result").style.display = "none";
      render();
    };

    render();
  </script>
</body>
</html>
